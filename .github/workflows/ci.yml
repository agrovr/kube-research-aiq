name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python:
    name: Research service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/research-service/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format github src tests
      - name: Test
        run: pytest -q
      - name: End-to-end dive through the API
        run: |
          KRAI_STORAGE_PATH="$RUNNER_TEMP/jobs.json" uvicorn kube_research_aiq.main:app --port 8000 &
          for _ in $(seq 30); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          ../../scripts/smoke-test.sh http://localhost:8000 60

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Type-check and build
        run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint every profile
        run: |
          for values in charts/kube-research-aiq/values-*.yaml; do
            echo "::group::$values"
            helm lint charts/kube-research-aiq --strict -f "$values"
            echo "::endgroup::"
          done
      - name: Render every profile
        run: |
          mkdir -p rendered
          status=0
          render() {  # name, then extra helm arguments; failures become annotations
            local name=$1; shift
            if ! helm template kuberesearch charts/kube-research-aiq -n aiq-system "$@" \
                > "rendered/$name.yaml" 2> "rendered/$name.err"; then
              echo "::error title=helm template $name::$(tr '\n' ' ' < "rendered/$name.err")"
              status=1
            fi
            rm -f "rendered/$name.err"
          }
          render default
          for values in charts/kube-research-aiq/values-*.yaml; do
            render "$(basename "$values" .yaml)" -f "$values"
          done
          # Optional features render too.
          render keda --set keda.enabled=true --set serviceMonitor.enabled=true \
            --set secrets.tavilyApiKey=test
          if ! grep -q "kind: ScaledObject" rendered/keda.yaml; then
            echo "::error title=KEDA::No ScaledObject rendered"; status=1
          fi
          # KEDA owns worker scaling, so only the API keeps an HPA.
          hpas=$(grep -c "kind: HorizontalPodAutoscaler" rendered/keda.yaml || true)
          if [ "$hpas" != 1 ]; then
            echo "::error title=KEDA::Expected 1 HPA with KEDA enabled, found $hpas"; status=1
          fi
          exit $status
      - name: Validate against Kubernetes schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [python, dashboard, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the release version
        id: version
        run: echo "version=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/kube-research-aiq/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          for app in research-service dashboard; do
            docker build \
              -t "ghcr.io/${{ github.repository }}/$app:${{ github.sha }}" \
              -t "ghcr.io/${{ github.repository }}/$app:${{ steps.version.outputs.version }}" \
              -t "ghcr.io/${{ github.repository }}/$app:latest" \
              "apps/$app"
          done
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 -e KRAI_STORAGE_PATH=/tmp/jobs.json \
            "ghcr.io/${{ github.repository }}/research-service:${{ github.sha }}"
          for _ in $(seq 30); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          scripts/smoke-test.sh http://localhost:8000 60 || { docker logs api; exit 1; }
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for app in research-service dashboard; do
            docker push --all-tags "ghcr.io/${{ github.repository }}/$app"
          done
