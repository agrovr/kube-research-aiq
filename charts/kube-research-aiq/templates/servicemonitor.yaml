{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-research-aiq.fullname" . }}
  labels:
    {{- include "kube-research-aiq.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    # The API reports queue and job totals; workers report dive and stage durations.
    - port: http
      path: /metrics
      interval: 30s
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
