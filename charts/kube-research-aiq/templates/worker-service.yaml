{{- if .Values.worker.metricsPort }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-research-aiq.fullname" . }}-worker-metrics
  labels:
    {{- include "kube-research-aiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    {{- include "kube-research-aiq.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
{{- end }}
